server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Se resuelve en cada peticion para que nginx arranque aunque el backend aun no este listo.
        resolver 127.0.0.11 valid=10s;
        set $backend http://spring-boot:8080;
        proxy_pass $backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Igual que el proxy de Vite: sin Origin el backend no rechaza la peticion por CORS.
        proxy_set_header Origin "";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
