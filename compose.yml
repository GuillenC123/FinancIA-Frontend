# Levanta solo el frontend de FinancIA (nginx) en http://localhost:3000.
# El backend no va en Docker: se enciende aparte y nginx le reenvia las peticiones /api.
# Por defecto lo busca en el puerto 8080 de tu PC; se cambia con BACKEND_URL en un archivo .env.

services:

  frontend:
    build: ./FinancIA-Frontend
    container_name: financia-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
